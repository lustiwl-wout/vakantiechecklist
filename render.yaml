services:
  - type: web
    name: vakantiechecklist
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Credentials voor het admin-portal op /admin (gebruikersbeheer).
      # Zonder deze twee vars is het portal uitgeschakeld.
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Google Places API-sleutel: de bron van de Omgeving-pagina (uitjes,
      # sterren, excursies). Zonder sleutel werkt de Omgeving-pagina niet;
      # de rest van de app wel. Data wordt 30 dagen gecachet (± 16 aanroepen
      # per locatie per maand); een maandteller bewaakt het gratis tegoed.
      - key: GOOGLE_PLACES_API_KEY
        sync: false
