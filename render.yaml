services:
  - type: web
    name: vakantiechecklist
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Credentials voor het admin-portal op /admin (gebruikersbeheer).
      # Zonder deze twee vars is het portal uitgeschakeld.
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optioneel: Google Places API-sleutel voor sterren bij uitjes op de
      # Omgeving-pagina. Zonder sleutel simpelweg geen sterren. Beoordelingen
      # worden 30 dagen gecachet; een maandteller bewaakt het gratis tegoed.
      - key: GOOGLE_PLACES_API_KEY
        sync: false
