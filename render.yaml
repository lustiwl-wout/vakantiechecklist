services:
  - type: web
    name: vakantiechecklist
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Tijdelijk: URL van de OUDE database om data uit te migreren.
      # De migratie draait automatisch bij het opstarten van de server
      # (idempotent; no-op als deze variabele niet gezet is). Verwijder
      # hem weer na een geslaagde migratie.
      - key: OLD_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
