services:
  - type: web
    name: vakantiechecklist
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Credentials voor het admin-portal op /admin (gebruikersbeheer).
      # Zonder deze twee vars is het portal uitgeschakeld.
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
